spring:
  application:
    name: data-reconciliation-platform
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
